<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - OpenGuard Kids</title>
</head>
<body>
    <h2>Welcome, {{ username }}</h2>
    <h3>Devices</h3>
    <table border="1" cellpadding="5">
        <tr>
            <th>Device ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Last Seen (UTC)</th>
        </tr>
        {% for d in devices %}
        <tr>
            <td>{{ d.id }}</td>
            <td>{{ d.name }}</td>
            <td>{{ d.status }}</td>
            <td>{{ d.last_seen }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4">No devices found.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
